<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QClaw - AI 智能助手</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; }
        .card { text-align:center; padding:3rem; max-width:600px; }
        h1 { font-size:3rem; margin-bottom:1rem; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        p { font-size:1.2rem; color:#aab; margin-bottom:2rem; line-height:1.8; }
        .badge { display:inline-block; background:rgba(0,210,255,0.15); color:#00d2ff; padding:0.5rem 1.2rem; border-radius:50px; margin:0.3rem; font-size:0.9rem; }
        .powered { margin-top:2rem; font-size:0.8rem; color:#556; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 QClaw</h1>
        <p>全栈 AI 智能助手，随时随地帮您高效干活</p>
        <div>
            <span class="badge">🤖 AI Agent</span>
            <span class="badge">☁️ 云端部署</span>
            <span class="badge">⚡ 实时响应</span>
        </div>
        <div class="powered">Powered by GitHub Pages</div>
    </div>
</body>
</html>
