<head>

<title>MOMO影视</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:#fff;padding-bottom:70px}
.hdr{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.05)}
.hdr-t{font-size:20px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pg{display:none;padding:12px}
.pg.on{display:block}
.sec{margin-bottom:20px}
.sec-h{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pc{border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer;transition:transform .2s}
.pc:active{transform:scale(.96)}
.pc-i{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600}
.pc-t{padding:8px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-s{font-size:11px;color:#ff9500;padding:0 8px 8px}
.tab{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);display:flex;border-top:1px solid rgba(0,0,0,.05);z-index:1000}
.ti{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0;cursor:pointer;color:#86868b;transition:all .2s}
.ti.on{color:#667eea}
.ti i{font-size:22px;margin-bottom:2px}
.ti s{font-size:10px;font-style:none;text-decoration:none}
.flt{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.ft{flex-shrink:0;padding:6px 14px;border-radius:20px;background:#f5f5f7;font-size:13px;color:#1d1d1f;cursor:pointer;white-space:nowrap}
.ft.on{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:flex-end}
.mask.on{display:flex}
.sht{width:100%;max-width:480px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mv-t{font-size:20px;font-weight:700;margin-bottom:8px}
.mv-m{display:flex;gap:12px;font-size:13px;color:#86868b;margin-bottom:12px;flex-wrap:wrap}
.mv-d{font-size:14px;line-height:1.6;color:#424245;margin-bottom:16px}
.ply-b{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px}
.eps-g{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ep-b{width:44px;height:36px;border:1px solid #e5e5ea;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.ep-b.on{background:#667eea;color:#fff;border-color:#667eea}
.src-g{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.src-b{padding:6px 14px;border-radius:8px;background:#f5f5f7;font-size:13px;cursor:pointer;border:none}
.src-b.on{background:#667eea;color:#fff}
.plyr{position:fixed;inset:0;background:#000;z-index:3000;display:none;flex-direction:column}
.plyr.on{display:flex}
.plyr-t{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.plyr-t span{cursor:pointer;padding:8px}
.plyr-c{flex:1;display:flex;align-items:center;justify-content:center}
.plyr-f{width:100%;height:100%;border:none}
.cb{display:none;text-align:center;padding:40px 20px}
.cb.on{display:block}
.vip-c{width:100%;max-width:320px;margin:0 auto;background:linear-gradient(135deg,#f6d365,#fda085);border-radius:20px;padding:24px;color:#fff;margin-bottom:20px}
.vip-c h3{font-size:22px;margin-bottom:8px}
.vip-p{font-size:36px;font-weight:700;margin-bottom:8px}
.pkg-g{display:flex;gap:12px;margin-bottom:24px;justify-content:center}
.pkg{padding:16px 20px;border-radius:16px;border:2px solid #e5e5ea;cursor:pointer;text-align:center;min-width:90px}
.pkg.on{border-color:#667eea;background:#f5f5ff}
.pkg-n{font-size:14px;color:#424245;margin-bottom:4px}
.pkg-p{font-size:20px;font-weight:700;color:#667eea}
.tst{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;display:none;font-size:14px}
.btns{display:flex;gap:12px}
.btn1{flex:1;padding:12px;border:1px solid #e5e5ea;border-radius:12px;background:#fff;font-size:14px;cursor:pointer}
.btn2{flex:1;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;cursor:pointer}
.wx-b{width:100%;padding:14px;border:none;border-radius:12px;background:#07c160;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.pay-m{text-align:center;padding:20px}
.pay-m p{margin-bottom:16px;color:#86868b}
</style>
</head>

<div class="pg" id="pg-lib"><div class="grid" id="lib-list"></div></div>

<div class="pg" id="pg-me">

</div>
<div id="logged-in" class="cb">

<div id="vip-status" style="margin-bottom:24px"></div>

</div>
</div>

<div class="tab">
<div class="ti on" data-t="home" onclick="switchTab('home',this)"><i>🏠</i><s>首页</s></div>
<div class="ti" data-t="cat" onclick="switchTab('cat',this)"><i>🎬</i><s>分类</s></div>
<div class="ti" data-t="lib" onclick="switchTab('lib',this)"><i>🎞️</i><s>电影</s></div>
<div class="ti" data-t="me" onclick="switchTab('me',this)"><i>👤</i><s>我的</s></div>

</div>

<div class="mask" id="dtl-mask"><div class="sht" id="dtl-content"></div></div>

<div class="pkg-g" id="pkg-list"></div>

<button class="btn1" style="width:100%" onclick="closeVip()">取消</button>
</div></div>
<div class="mask" id="pay-mask" style="align-items:center"><div class="sht" style="border-radius:20px">
<div class="pay-m">

<div style="display:flex;gap:12px;margin:24px 0">
<button class="wx-b" onclick="doPay('wx')" style="flex:1">微信支付</button>
<button class="wx-b" onclick="doPay('ali')" style="flex:1;background:#1677ff">支付宝</button>
</div>
<button class="btn1" style="width:100%" onclick="closePay()">取消支付</button>
</div>
</div></div>

// ==================== 状态管理 ====================
var stack = ['home'], me = null, curDtl = null, curSrc = 0, curEp = 1, curPkg = 1;
var catFilter = {type:'',y:'',r:'',g:''};
var types = ['全部','电影','电视剧','动漫','综艺'];
var years = ['全部'];
for(var y=2024;y>=1990;y--)years.push(y.toString());
var regions = ['全部','中国大陆','中国香港','中国台湾','美国','日本','韩国','英国','法国','印度','泰国','德国','西班牙','意大利','加拿大','澳大利亚','俄罗斯','巴西','其他'];
var genres = ['全部','剧情','喜剧','动作','爱情','科幻','悬疑','惊悚','恐怖','动画','奇幻','武侠','古装','战争','犯罪','冒险','灾难','纪录片','综艺','脱口秀','音乐','运动'];

// ==================== 工具函数 ====================
function $(i){return document.getElementById(i)}
function toast(m){var t=$('tst');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
function saveUser(){if(me)localStorage.setItem('momo_user',JSON.stringify(me));else localStorage.removeItem('momo_user')}
function loadUser(){try{var s=localStorage.getItem('momo_user');if(s)me=JSON.parse(s)}catch(e){me=null}}

// ==================== 数据查询 ====================
function getHome(){
    return {
        hot: MOVIES.slice(0,8),
        movie: MOVIES.filter(function(m){return m.type==='movie'}),
        tv: MOVIES.filter(function(m){return m.type==='tv'}),
        anime: MOVIES.filter(function(m){return m.type==='anime'}),
        variety: MOVIES.filter(function(m){return m.type==='variety'})
    };
}
function getList(filter){
    var list = MOVIES.filter(function(m){
        if(filter.type){
            var typeMap={'电影':'movie','电视剧':'tv','动漫':'anime','综艺':'variety'};
            if(m.type!==typeMap[filter.type])return false;
        }
        if(filter.y&&m.y!=parseInt(filter.y))return false;
        if(filter.r&&m.r.indexOf(filter.r)===-1)return false;
        if(filter.g&&m.g.indexOf(filter.g)===-1)return false;
        return true;
    });
    return {list:list,total:list.length};
}
function getDetail(id){
    for(var i=0;i<MOVIES.length;i++){if(MOVIES[i].id===id)return MOVIES[i]}
    return null;
}
function getPlayUrl(movie,srcIdx,ep){
    var sources = movie.src||[];
    if(sources.length===0)return null;
    return sources[srcIdx % sources.length];
}

// ==================== 页面切换 ====================
function switchTab(t,e){
    document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});
    document.querySelectorAll('.ti').forEach(function(i){i.classList.remove('on')});
    var pg=$('pg-'+t);if(pg)pg.classList.add('on');
    if(e)e.classList.add('on');
    else{var ti=document.querySelector('.ti[data-t="'+t+'"]');if(ti)ti.classList.add('on')}
    $('hdr').style.display=(t==='home'||t==='lib'||t==='cat')?'flex':'none';
    if(stack[stack.length-1]!==t){stack.push(t);try{history.pushState({tab:t},'',location.href)}catch(e){}}
    if(t==='cat'&&!$('cat-list').children.length)loadCat();
    if(t==='lib')loadLib();
    if(t==='me')loadMe();
}

// ==================== 渲染函数 ====================
function renderCard(m){
    var colors=['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fee140','#30cfd0'];
    var color=colors[m.id%colors.length];
    var short=m.t.length>4?m.t.substring(0,4):m.t;
    return '<div class="pc" onclick="showDetail('+m.id+')"><div class="pc-i" style="background:linear-gradient(135deg,'+color+','+color+'dd);font-size:18px">'+short+'</div><div class="pc-t">'+m.t+'</div><div class="pc-s">★'+m.s+'</div></div>';
}

function loadHome(){
    var d=getHome();
    $('hot-list').innerHTML=d.hot.map(renderCard).join('');
    $('movie-list').innerHTML=d.movie.map(renderCard).join('');
    $('tv-list').innerHTML=d.tv.map(renderCard).join('');
    $('anime-list').innerHTML=d.anime.map(renderCard).join('');
    $('variety-list').innerHTML=d.variety.map(renderCard).join('');
}

function loadLib(){
    var d=getList({type:'电影'});
    $('lib-list').innerHTML=d.list.map(renderCard).join('');
}

function renderFilters(){
    var h='';
    types.forEach(function(t,i){h+='<div class="ft'+(i===0?' on':'')+'" onclick="setFilter(\'type\',this,\''+(i===0?'':t)+'\')">'+t+'</div>'});
    $('type-flt').innerHTML=h;
    h='';
    years.forEach(function(y,i){h+='<div class="ft'+(i===0?' on':'')+'" onclick="setFilter(\'y\',this,\''+(i===0?'':y)+'\')">'+y+'</div>'});
    $('year-flt').innerHTML=h;
    h='';
    regions.forEach(function(r,i){h+='<div class="ft'+(i===0?' on':'')+'" onclick="setFilter(\'r\',this,\''+(i===0?'':r)+'\')">'+r+'</div>'});
    $('region-flt').innerHTML=h;
    h='';
    genres.forEach(function(g,i){h+='<div class="ft'+(i===0?' on':'')+'" onclick="setFilter(\'g\',this,\''+(i===0?'':g)+'\')">'+g+'</div>'});
    $('genre-flt').innerHTML=h;
}

function setFilter(k,el,v){
    catFilter[k]=v;
    el.parentElement.querySelectorAll('.ft').forEach(function(f){f.classList.remove('on')});
    el.classList.add('on');
    loadCat();
}

function loadCat(){
    var d=getList(catFilter);
    $('cat-list').innerHTML=d.list.map(renderCard).join('');
}

// ==================== 详情页 ====================
function showDetail(id){
    var m=getDetail(id);
    if(!m){toast('影片不存在');return}
    curDtl=m;curEp=1;curSrc=0;
    var eps=[];
    var count=m.eps||1;
    for(var i=1;i<=count;i++)eps.push('<button class="ep-b'+(i===1?' on':'')+'" onclick="selectEp('+i+',this)">'+i+'</button>');
    var srcs=(m.src||[]).map(function(_,i){return '<button class="src-b'+(i===0?' on':'')+'" onclick="selectSrc('+i+',this)">线路'+(i+1)+'</button>'}).join('');
    $('dtl-content').innerHTML=
        '<div class="mv-t">'+m.t+'</div>'+
        '<div class="mv-m"><span>'+m.y+'</span><span>'+m.r+'</span><span>'+m.g+'</span><span>★'+m.s+'</span></div>'+
        '<div class="mv-d">'+m.d+'</div>'+
        (count>1?'<div style="font-size:13px;color:#86868b;margin-bottom:8px">选集</div><div class="eps-g">'+eps.join('')+'</div>':'')+
        '<div style="font-size:13px;color:#86868b;margin-bottom:8px">播放线路</div><div class="src-g">'+srcs+'</div>'+
        '<button class="ply-b" onclick="startPlay()">▶ 立即播放</button>';
    $('dtl-mask').classList.add('on');
}
function closeDetail(){$('dtl-mask').classList.remove('on')}
function selectEp(n,el){curEp=n;document.querySelectorAll('.ep-b').forEach(function(b){b.classList.remove('on')});el.classList.add('on')}
function selectSrc(n,el){curSrc=n;document.querySelectorAll('.src-b').forEach(function(b){b.classList.remove('on')});el.classList.add('on')}

// ==================== 播放器 ====================
function startPlay(){
    if(!curDtl)return;
    var url=getPlayUrl(curDtl,curSrc,curEp);
    if(!url){toast('暂无播放源');return}
    $('ply-title').textContent=curDtl.t;
    $('ply-f').src=url;
    $('plyr').classList.add('on');
    closeDetail();
}
function closePly(){$('plyr').classList.remove('on');$('ply-f').src=''}

// ==================== 登录/用户 ====================
function wxLogin(){
    var uid='u'+Date.now();
    me={id:uid,name:'微信用户'+uid.substr(-4),avatar:'',is_vip:false,vip_expire:0};
    saveUser();
    showUser();
    toast('登录成功！');
}
function loadMe(){
    loadUser();
    if(me)showUser();else showLogin();
}
function showLogin(){$('logged-out').classList.add('on');$('logged-in').classList.remove('on')}
function showUser(){
    $('logged-out').classList.remove('on');
    $('logged-in').classList.add('on');
    $('user-name').textContent=me.name;
    if(me.is_vip&&me.vip_expire>Date.now()/1000){
        var exp=new Date(me.vip_expire*1000);
        $('vip-status').innerHTML='<span style="color:#f6d365;font-weight:600">👑 VIP会员 至'+exp.getFullYear()+'-'+(exp.getMonth()+1)+'-'+exp.getDate()+'</span>';
        $('vip-btn').textContent='续费VIP';
    }else{
        $('vip-status').innerHTML='<span style="color:#86868b">普通用户</span>';
        $('vip-btn').textContent='开通VIP';
        me.is_vip=false;
    }
}

// ==================== VIP支付 ====================
function showVip(){
    var h='';
    VIP_PACKAGES.forEach(function(p,i){h+='<div class="pkg'+(i===0?' on':'')+'" onclick="selectPkg('+p.id+',this)"><div class="pkg-n">'+p.name+'</div><div class="pkg-p">¥'+p.price+'</div></div>'});
    $('pkg-list').innerHTML=h;
    curPkg=1;
    $('vip-mask').classList.add('on');
}
function closeVip(){$('vip-mask').classList.remove('on')}
function selectPkg(id,el){curPkg=id;document.querySelectorAll('.pkg').forEach(function(p){p.classList.remove('on')});el.classList.add('on')}
function payVip(){
    if(!me){toast('请先登录');return}
    var pkg=null;
    for(var i=0;i<VIP_PACKAGES.length;i++){if(VIP_PACKAGES[i].id===curPkg){pkg=VIP_PACKAGES[i];break}}
    if(!pkg){toast('套餐错误');return}
    $('pay-order').textContent='MOMO'+Date.now();
    $('pay-amount').textContent='¥'+pkg.price;
    $('vip-mask').classList.remove('on');
    $('pay-mask').classList.add('on');
    window._curPkg=pkg;
}
function closePay(){$('pay-mask').classList.remove('on')}
function doPay(type){
    if(!me||!window._curPkg){closePay();return}
    var pkg=window._curPkg;
    me.is_vip=true;
    me.vip_expire=Math.floor(Date.now()/1000)+pkg.days*86400;
    saveUser();
    closePay();
    showUser();
    toast('🎉 开通成功！');
}

// ==================== 事件绑定 ====================
$('dtl-mask').addEventListener('click',function(e){if(e.target===$('dtl-mask'))closeDetail()});
$('vip-mask').addEventListener('click',function(e){if(e.target===$('vip-mask'))closeVip()});
$('pay-mask').addEventListener('click',function(e){if(e.target===$('pay-mask'))closePay()});
window.addEventListener('popstate',function(e){
    stack.pop();
    if(stack.length>0){var t=stack[stack.length-1];switchTab(t)}
    else{try{history.pushState({tab:'home'},'',location.href)}catch(e){}stack=['home']}
});

// ==================== 初始化 ====================
(function(){
    loadUser();
    renderFilters();
    loadHome();
})();
